# ---------------------------------------------------------------------------
# Large employers with established internship programs.
#
# To add a company, copy one block and edit it. Fields:
#   name        Display name on the board.
#   enabled     true = collected every run. Start small, flip more on later.
#   sector      Used by the board's preset pages. One of:
#               Biotech/Pharma, Aerospace & Defense, Medical Devices,
#               Chemicals & Materials, Energy, Other Industry
#   careers_url The public careers page. Used for ATS auto-detection.
#   ats         Which applicant tracking system serves the jobs:
#               workday | greenhouse | lever | icims | auto
#               "auto" = the agent fetches careers_url, works out the ATS, and
#               caches the answer in data/ats_cache.json.
#   ats_config  Only needed when ats is not "auto" (copy from a working entry):
#     workday:    host, tenant, site   (from https://HOST/wday/cxs/TENANT/SITE/jobs)
#     greenhouse: board                (from boards.greenhouse.io/BOARD)
#     lever:      company              (from jobs.lever.co/COMPANY)
#     icims:      portal               (from https://PORTAL.icims.com)
#   search_prefix  Optional word added in front of each Workday search term,
#               for shared portals (e.g. Genentech jobs live on Roche's site).
#
# Entries marked "verified" had their ATS endpoint confirmed in October 2026.
# ---------------------------------------------------------------------------

companies:
  # ----- Enabled for the first version (5 companies) -----
  - name: Pfizer
    enabled: true
    sector: Biotech/Pharma
    careers_url: https://www.pfizer.com/about/careers
    ats: workday            # verified
    ats_config: {host: pfizer.wd1.myworkdayjobs.com, tenant: pfizer, site: PfizerCareers}

